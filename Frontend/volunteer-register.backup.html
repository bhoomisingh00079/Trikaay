<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900">Volunteer Registration</h1>
                <p class="text-gray-600 mt-2">Join our mission and make a difference</p>
            </div>

            <!-- Success Message (hidden by default) -->
            <div id="successMessage" class="hidden mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded">
                <p><strong>Registration successful!</strong> We will review your application and contact you.</p>
            </div>

            <!-- Error Message (hidden by default) -->
            <div id="errorMessage" class="hidden mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded">
                <p id="errorText"></p>
            </div>

            <!-- Registration Form -->
            <form id="volunteerForm" class="space-y-5">
                <!-- Name Field -->
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Your Name"
                    />
                    <span class="text-red-500 text-sm hidden" id="nameError">Name is required</span>
                </div>

                <!-- Phone Number Field -->
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone Number *</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Your Phone Number"
                    />
                    <span class="text-red-500 text-sm hidden" id="phoneError">Valid phone number is required</span>
                </div>

                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address *</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Your Email Address"
                    />
                    <span class="text-red-500 text-sm hidden" id="emailError">Valid email is required</span>
                </div>

                <!-- Position Field -->
                <div>
                    <label for="position" class="block text-sm font-medium text-gray-700 mb-1">Position / Role *</label>
                    <input
                        type="text"
                        id="position"
                        name="position"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="e.g., Event Coordinator, Content Writer"
                    />
                    <span class="text-red-500 text-sm hidden" id="positionError">Position is required</span>
                </div>

                <!-- Experience Field -->
                <div>
                    <label for="experience" class="block text-sm font-medium text-gray-700 mb-1">Experience (Optional)</label>
                    <textarea
                        id="experience"
                        name="experience"
                        rows="3"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Tell us about your relevant experience..."
                    ></textarea>
                </div>

                <!-- Availability Dropdown -->
                <div>
                    <label for="availability" class="block text-sm font-medium text-gray-700 mb-1">Availability *</label>
                    <select
                        id="availability"
                        name="availability"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    >
                        <option value="">Select your availability</option>
                        <option value="Full-time">Full-time</option>
                        <option value="Part-time">Part-time</option>
                        <option value="Weekend">Weekend</option>
                    </select>
                    <span class="text-red-500 text-sm hidden" id="availabilityError">Availability is required</span>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition duration-200 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                >
                    Submit Registration
                </button>
            </form>

            <!-- Required Fields Note -->
            <p class="text-xs text-gray-500 text-center mt-4">* indicates required field</p>
        </div>
    </div>

    <!-- JavaScript for Form Handling -->
    <script src="volunteer-register.js"></script>
</body>
</html>
